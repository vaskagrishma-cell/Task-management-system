<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="auth-container">
    <h1>Create Account</h1>
    <p>Register to manage your daily tasks.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <p class="message" role="status">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="name">Full name</label>
        <input id="name" type="text" name="name" autocomplete="name"
               maxlength="100" placeholder="Full Name" required>

        <label for="email">Email address</label>
        <input id="email" type="email" name="email" autocomplete="email"
               maxlength="150" placeholder="Email Address" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password"
               autocomplete="new-password" minlength="8"
               placeholder="Password (minimum 8 characters)" required>

        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</main>
</body>
</html>
